<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Speaker to be announced">
    <title>Speaker to be announced</title>
    <defs>
        <linearGradient id="tbaBg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f8f9fa" />
            <stop offset="100%" stop-color="#e9ecef" />
        </linearGradient>
    </defs>

    <rect width="300" height="300" fill="url(#tbaBg)" />

    <!-- shoulders + head silhouette, echoing a portrait crop -->
    <g fill="#dee2e6">
        <circle cx="150" cy="118" r="52" />
        <path d="M150 182c-49 0-89 33-97 78h194c-8-45-48-78-97-78z" />
    </g>

    <!-- question mark -->
    <text x="150" y="196"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="150" font-weight="700" fill="#dc3545"
        text-anchor="middle">?</text>
</svg>
